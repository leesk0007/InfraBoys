---
# AWS EC2 Dynamic Inventory
# Role 태그를 기준으로 호스트 그룹 자동 생성
#   Role=DB  → 'db'  그룹
#   Role=WAS → 'was' 그룹
#
# 사전 조건:
#   pip install boto3 botocore
#   ansible-galaxy collection install amazon.aws

plugin: amazon.aws.aws_ec2

regions:
  - ap-northeast-2

filters:
  instance-state-name:
    - running
  tag:Name:
    - project02_db_ec2
    - project02-was-ec2

# private IP를 호스트 주소로 사용 (프라이빗 서브넷)
hostnames:
  - private-ip-address

# Role 태그 값을 소문자로 변환해서 그룹명으로 사용
# Role=DB  → 그룹 'db'
# Role=WAS → 그룹 'was'
keyed_groups:
  - key: tags.Role | lower
    prefix: ""
    separator: ""
