# =======================================================================
#  prometheus가 slack / discord / fastapi 등으로 보내는 알람을 관리하는 yml
# =======================================================================
groups:
  # ============================================================
  #  Recording Rules (현재값 / 예측값 미리 계산)
  # ============================================================
  - name: node_usage_recording
    interval: 30s
    rules:
      # cpu
      - record: present_average_cpu
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100

      - record: future_average_cpu
        expr: predict_linear(present_average_cpu[30m:], 10 * 60)

      # memory
      - record: present_average_memory
        expr: avg((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)

      - record: future_average_memory
        expr: predict_linear(present_average_memory[30m:], 10 * 60)

  # ============================================================
  #  예측 + 현재값 알람 (현재값 OR 5분 후 예측값)
  #  - LEVEL 1: 50% 초과 ~ 60% 이하 / 5분 지속 → scale out
  #  - LEVEL 2: 60% 초과 ~ 75% 이하 / 3분 지속 → scale out
  # ============================================================
  - name: node_predict_alerts
    interval: 30s
    rules:
      # ---------- LEVEL 1: 50 < x <= 60 ----------
      - alert: Level1-cpu
        expr: |
          (
            (present_average_cpu > 50 and present_average_cpu <= 60)
            or
            (future_average_cpu  > 50 and future_average_cpu  <= 60)
          )
          unless
          (present_average_cpu > 60 or future_average_cpu > 60)
        for: 5m
        labels:
          level: "1"
          action: scale_out

      - alert: Level1-memory
        expr: |
          (
            (present_average_memory > 75 and present_average_memory <= 85)
            or
            (future_average_memory  > 75 and future_average_memory  <= 85)
          )
          unless
          (present_average_memory > 85 or future_average_memory > 85)
        for: 5m
        labels:
          level: "1"
          action: scale_out
      # ---------- LEVEL 2: 60 < x <= 75 ----------
      - alert: Level2-cpu
        expr: |
          (present_average_cpu > 60)
          or
          (future_average_cpu  > 60)
        for: 3m
        labels:
          level: "2"
          action: scale_out

      - alert: Level2-memory
        expr: |
          (present_average_memory > 85)
          or
          (future_average_memory  > 85)
        for: 3m
        labels:
          level: "2"
          action: scale_out
  #   # ============================================================
  #   #  정상화 알람 (scale in 트리거)
  #   #  - CPU/메모리 모두 50% 이하로 5분 이상 지속 시 발동
  #   # ============================================================
  - name: Normarlized-cpu
    interval: 30s
    rules:
      - alert: CPUNormalized
        expr: |
          (present_average_cpu <= 50)
          and
          (future_average_cpu  <= 50)
        for: 5m
        labels:
          action: scale_in

      - alert: Normalized-memory
        expr: |
          (present_average_memory <= 60)
          and
          (future_average_memory  <= 60)
        for: 5m
        labels:
          action: scale_in

  # ============================================================
  #  AIOps 장애 케이스별 감지 룰 (PostgreSQL 버전)
  # ============================================================
  - name: Aiops_fault_detection
    interval: 30s
    rules:
      # 1. Nginx 비정상 종료 테스트 완
      - alert: Nginx-down
        expr: nginx_up == 0
        for: 30s
        labels:
          action: Aiops_nginx_restart
          case: "nginx_down"
        annotations:
          summary: "Nginx 프로세스 종료 감지"
          log_keyword: "Main process exited"

      # 2. 디스크 용량 95% 초과 테스트 완
      - alert: Disk-full
        expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 > 95
        for: 1m
        labels:
          action: Aiops_disk_cleanup
          case: "disk_full"
        annotations:
          summary: "디스크 사용률 95% 초과"
          log_keyword: "No space left on device"

      # 3. 좀비 프로세스 / CPU 100% 점유 테스트 완
      - alert: ZombieProcess
        expr: namedprocess_namegroup_states{state="Zombie", groupname=~"nginx|python.*|docker"} > 0
        for: 2m
        labels:
          action: Aiops_kill_process
          case: "zombie_process"
        annotations:
          summary: "좀비 프로세스 감지 ({{ $labels.groupname }})"

      #  4. PostgreSQL 커넥션 풀 고갈 테스트 완
      - alert: Postgres-connectionfullout
        expr: |
          sum(pg_stat_activity_count{state="active"})
          /
          scalar(max(pg_settings_max_connections))
          > 0.2
        for: 1m
        labels:
          action: Aiops_kill_idle_connections
          case: "db_connection_full"
        annotations:
          summary: "PostgreSQL 커넥션 20% 이상 사용"
          log_keyword: "too many connections"

      #  5. PostgreSQL 프로세스 다운 테스트 완
      - alert: Postgres-down
        expr: pg_up == 0
        for: 30s
        labels:
          action: Aiops_db_restart
          case: "db_down"
        annotations:
          summary: "PostgreSQL 프로세스 다운"
          log_keyword: "Connection refused"
