name: "App Deploy (Instance Refresh)"

on:
  workflow_call:  # app-image.yml에서 빌드 성공 후 자동 호출
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유"
        required: false
        default: "Manual deploy"

jobs:
  deploy:
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_REGION: ap-northeast-2

    steps:
      - name: Instance Refresh 시작
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name project02-asg \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":60}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "🔄 Instance Refresh 시작: $REFRESH_ID"

      - name: Refresh 완료 대기
        timeout-minutes: 20
        run: |
          REFRESH_ID=${{ steps.refresh.outputs.refresh_id }}

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name project02-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            PERCENT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name project02-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text)

            echo "[$(date +%H:%M:%S)] 상태: $STATUS ($PERCENT%)"

            case $STATUS in
              Successful) echo "✅ 배포 완료!"; exit 0 ;;
              Failed|Cancelled) echo "❌ 배포 실패: $STATUS"; exit 1 ;;
            esac

            sleep 20
          done

      - name: ALB 헬스체크 확인
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names project02-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "ALB: http://$ALB_DNS"
          curl -f --retry 5 --retry-delay 5 http://$ALB_DNS/health
          echo "✅ 앱 정상 동작 확인!"

      - name: Send Success Notification
        if: success()
        run: |
          MESSAGE="✅ [배포 완료]
          - 트리거: ${{ github.actor }}
          - 커밋: ${{ github.sha }}
          - 새 이미지가 모든 인스턴스에 반영됐습니다."

          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          MESSAGE="❌ [배포 실패]
          - 실행자: ${{ github.actor }}
          - Instance Refresh 또는 헬스체크 실패. 로그를 확인하세요."

          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
