name: "Scale In"

on:
  repository_dispatch:
    types: [scale-in]
  workflow_dispatch:
    inputs:
      require_ec2:
        description: '축소할 EC2 인스턴스 수'
        required: true
        default: '1'
      sender:
        description: '발송 주체'
        required: true
        default: 'grafana'
        type: choice
        options:
          - grafana
          - alertmanager

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  scale_in_job:
    runs-on: self-hosted
    timeout-minutes: 60
    
    env:
      TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TF_VAR_db_user:            ${{ secrets.DB_USER }}
      TF_VAR_db_password:        ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Parse Inputs
        id: parse
        run: |
          # repository_dispatch 또는 workflow_dispatch에서 데이터 추출
          REQUIRE_EC2="${{ github.event.client_payload.require_ec2 || github.event.inputs.require_ec2 }}"
          SENDER="${{ github.event.client_payload.sender || github.event.inputs.sender || github.actor }}"
          
          if [ -z "$REQUIRE_EC2" ]; then REQUIRE_EC2="1"; fi
          
          echo "require_ec2=$REQUIRE_EC2" >> $GITHUB_OUTPUT
          echo "sender=$SENDER" >> $GITHUB_OUTPUT
          echo "=== 📥 Scale-In Request ==="
          echo "Requested EC2 reduction count: $REQUIRE_EC2"
          echo "Triggered by: $SENDER"

      - name: Get Current Capacity
        id: current
        run: |
          CURRENT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "project02-asg" \
            --query "AutoScalingGroups[0].DesiredCapacity" \
            --output text)
            
          TARGET=$((CURRENT - ${{ steps.parse.outputs.require_ec2 }}))
          if [ "$TARGET" -lt 1 ]; then TARGET=1; fi
          
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT -> Target: $TARGET"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Terraform
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Apply Scale In
        working-directory: terraform/envs/dev
        run: |
          terraform apply -auto-approve \
            -target="module.asg.aws_autoscaling_group.asg" \
            -var="desired_capacity=${{ steps.current.outputs.target }}"

      - name: Send Notification (Grafana)
        if: ${{ steps.parse.outputs.sender == 'grafana' }}
        run: |
          MESSAGE="🚨 [그라파나 즉시 스케일 인 실행]
          - 발송자: ${{ steps.parse.outputs.sender }}
          - 용량 변경: ${{ steps.current.outputs.current }}대 -> ${{ steps.current.outputs.target }}대"
          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Send Notification (Alertmanager)
        if: ${{ steps.parse.outputs.sender == 'alertmanager' }}
        run: |
          MESSAGE="📉 [프로메테우스 예측기반 스케일 인 실행]
          - 발송자: ${{ steps.parse.outputs.sender }}
          - 감소된 인스턴스: ${{ steps.parse.outputs.require_ec2 }}대
          - 용량 변경: ${{ steps.current.outputs.current }}대 -> ${{ steps.current.outputs.target }}대"
          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"