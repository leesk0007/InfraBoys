name: "Incident Response"

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: "접속 테스트할 서버의 Private IP (예: 10.0.10.40)"
        required: true
        default: "10.0.10.4"
      playbook:
        description: "실행할 Ansible Playbook 선택"
        required: true
        type: choice
        options:
          - was_restart_nginx.yml
          - was_kill_process.yml
          - was_cleanup_disk.yml
        default: was_restart_nginx.yml   # ✅ 수정
      pid:
        description: "종료할 프로세스 PID (kill_process.yml 선택 시 선택사항)"
        required: false
        default: ""

  repository_dispatch:
    types:
      - incident-response

env:
  PLAYBOOK_DIR: "ansible/runbooks"

jobs:
  Incident-response:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TARGET_IP=${{ github.event.client_payload.target_ip }}" >> $GITHUB_ENV
            echo "PLAYBOOK=${{ github.event.client_payload.playbook }}"   >> $GITHUB_ENV
            echo "PID_INPUT=${{ github.event.client_payload.pid }}"       >> $GITHUB_ENV
            echo "TRIGGER=repository_dispatch"                            >> $GITHUB_ENV
          else
            echo "TARGET_IP=${{ github.event.inputs.target_ip }}" >> $GITHUB_ENV
            echo "PLAYBOOK=${{ github.event.inputs.playbook }}"   >> $GITHUB_ENV
            echo "PID_INPUT=${{ github.event.inputs.pid }}"       >> $GITHUB_ENV
            echo "TRIGGER=workflow_dispatch"                      >> $GITHUB_ENV
          fi

      - name: Show Trigger Info
        run: |
          echo "🔔 Trigger    : $TRIGGER"
          echo "🎯 Target IP  : $TARGET_IP"
          echo "📜 Playbook   : $PLAYBOOK_DIR/$PLAYBOOK"
          echo "🔢 PID        : ${PID_INPUT:-(none)}"

      - name: Validate Inputs
        run: |
          if [ -z "$TARGET_IP" ]; then
            echo "❌ target_ip가 비어있습니다."
            exit 1
          fi
          if [ -z "$PLAYBOOK" ]; then
            echo "❌ playbook이 비어있습니다."
            exit 1
          fi
          if [ ! -f "$PLAYBOOK_DIR/$PLAYBOOK" ]; then
            echo "❌ 플레이북 파일이 존재하지 않습니다: $PLAYBOOK_DIR/$PLAYBOOK"
            exit 1
          fi

      - name: Setup SSH Key
        run: |
          SSH_KEY_PATH="$RUNNER_TEMP/ansible_key_${{ github.run_id }}"
          echo "${{ secrets.ANSIBLE_KEY }}" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_REMOTE_TMP: "/tmp"
        run: |
          EXTRA_ARGS=""
          if [ "$PLAYBOOK" = "was_kill_process.yml" ] && [ -n "$PID_INPUT" ]; then
            EXTRA_ARGS="-e pid=$PID_INPUT"
          fi

          ansible-playbook -i "${TARGET_IP}," \
            "$PLAYBOOK_DIR/$PLAYBOOK" \
            -u ec2-user \
            --private-key "$SSH_KEY_PATH" \
            $EXTRA_ARGS

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$SSH_KEY_PATH"

      - name: Send Incident Success Notification
        if: success()
        run: |
          MESSAGE="✅ **장애 복구 성공**
          - **대상 IP**: ${{ env.TARGET_IP }}
          - **수행 플레이북**: ${{ env.PLAYBOOK }}
          - **결과**: 복구 작업 완료
          - **로그 확인**: [GitHub Actions 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Send Incident Failure Notification
        if: failure()
        run: |
          MESSAGE="❌ **장애 복구 실패 (수동 개입 필요)**
          - **대상 IP**: ${{ env.TARGET_IP }}
          - **수행 플레이북**: ${{ env.PLAYBOOK }}
          - **결과**: 복구 조치 도중 오류 발생 또는 복구 조건 미충족
          - **로그 확인**: [GitHub Actions 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"