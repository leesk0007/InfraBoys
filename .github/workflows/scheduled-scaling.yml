name: "Scheduled Scaling"

on:
  repository_dispatch:
    types: [scheduled-scale]
  workflow_dispatch:
    inputs:
      require_ec2:
        description: "추가할 EC2 인스턴스 수"
        required: true
        default: "1"
      duration:
        description: "유지 시간 (분)"
        required: true
        default: "10"
      sender:
        description: "발송 주체"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - grafana
          - alertmanager

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  scheduled_scale_job:
    runs-on: self-hosted
    timeout-minutes: 120

    env:
      TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Parse Inputs
        id: parse
        run: |
          # repository_dispatch 또는 workflow_dispatch에서 데이터 추출
          REQUIRE_EC2="${{ github.event.client_payload.require_ec2 || github.event.inputs.require_ec2 }}"
          DURATION_RAW="${{ github.event.client_payload.duration || github.event.inputs.duration }}"
          SENDER="${{ github.event.client_payload.sender || github.event.inputs.sender || github.actor }}"

          # Remove 'min' from duration if present
          DURATION="${DURATION_RAW//min/}"

          if [ -z "$REQUIRE_EC2" ]; then REQUIRE_EC2="1"; fi
          if [ -z "$DURATION" ]; then DURATION="10"; fi
          if [ -z "$SENDER" ]; then SENDER="grafana"; fi

          echo "require_ec2=$REQUIRE_EC2" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "sender=$SENDER" >> $GITHUB_OUTPUT

          echo "=== 📥 Scheduled Scale Request ==="
          echo "Require EC2: $REQUIRE_EC2"
          echo "Duration: $DURATION minutes"
          echo "Sender: $SENDER"

      - name: Get Current Capacity
        id: current
        run: |
          ORIGINAL_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "project02-asg" \
            --query "AutoScalingGroups[0].DesiredCapacity" \
            --output text)
            
          TARGET=$((ORIGINAL_CAPACITY + ${{ steps.parse.outputs.require_ec2 }}))

          echo "original_capacity=$ORIGINAL_CAPACITY" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Original Capacity: $ORIGINAL_CAPACITY -> Target: $TARGET"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Terraform
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Scale Up
        working-directory: terraform/envs/dev
        run: |
          terraform apply -auto-approve \
            -target="module.asg.aws_autoscaling_group.asg" \
            -var="desired_capacity=${{ steps.current.outputs.target }}"
          echo "✅ 스케일 업 완료: ${{ steps.current.outputs.target }}대"

      - name: Send Scale Up Notification
        run: |
          MESSAGE="⏳ [그라파나 예약 스케일 아웃 시작]
          - 목표 용량: ${{ steps.current.outputs.target }}대
          - 유지 시간: ${{ steps.parse.outputs.duration }}분
          - 요청자: ${{ steps.parse.outputs.sender }}"
          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Wait for Duration
        run: |
          DURATION=${{ steps.parse.outputs.duration }}
          echo "⏰ ${DURATION}분 동안 용량 유지 중..."
          sleep $((DURATION * 60))
          echo "✅ 대기 완료"

      - name: Scale Down (Return to Original)
        working-directory: terraform/envs/dev
        run: |
          terraform apply -auto-approve \
            -target="module.asg.aws_autoscaling_group.asg" \
            -var="desired_capacity=${{ steps.current.outputs.original_capacity }}"
          echo "✅ 스케일 다운 완료 (복구): ${{ steps.current.outputs.original_capacity }}대"

      - name: Send Final Notification
        if: always()
        run: |
          MESSAGE="✅ [그라파나 예약 스케일 아웃 종료]
          - 실행 결과: ${{ job.status }}
          - 요청자: ${{ steps.parse.outputs.sender }}
          - 최종 상태: 기존 용량(${{ steps.current.outputs.original_capacity }}대) 복구 완료"
          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"
