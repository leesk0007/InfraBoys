name: "Rollback"

on:
  repository_dispatch:
    types: [rollback]
  workflow_dispatch:
    inputs:
      sender:
        description: "발송 주체"
        required: true
        default: "grafana"
        type: choice
        options:
          - grafana

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  rollback_job:
    runs-on: self-hosted
    timeout-minutes: 60

    env:
      TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Parse Inputs
        id: parse
        run: |
          # repository_dispatch 또는 workflow_dispatch에서 데이터 추출
          SENDER="${{ github.event.client_payload.sender || github.event.inputs.sender || github.actor }}"
          if [ -z "$SENDER" ]; then SENDER="grafana"; fi

          echo "sender=$SENDER" >> $GITHUB_OUTPUT
          echo "=== 📥 Rollback Request ==="
          echo "Triggered by: $SENDER"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Apply Rollback
        working-directory: terraform/envs/dev
        run: |
          # 긴급 롤백 시 돌아갈 기본 용량 (예: 1대)
          # 인프라 상황에 맞게 1대 또는 3대 등으로 수정하실 수 있습니다.
          terraform apply -auto-approve \
            -target="module.asg.aws_autoscaling_group.asg" \
            -var="desired_capacity=1"

      - name: Send Notification
        run: |
          MESSAGE="🚑 [긴급 롤백 실행]
          - 요청자: ${{ steps.parse.outputs.sender }}
          - 상태: 기본 설정 용량으로 롤백 완료"
          jq -n --arg msg "$MESSAGE" '{"content": $msg}' > discord-payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @discord-payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"
